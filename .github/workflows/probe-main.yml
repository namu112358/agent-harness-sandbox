name: probe-main
on:
  workflow_dispatch:
  pull_request_target:
permissions: {}
jobs:
  env-secret:
    runs-on: ubuntu-latest
    environment: gate
    steps:
      - run: echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF secret_len=${#PROBE}"
        env:
          PROBE: ${{ secrets.PROBE_SECRET }}
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - run: node --version
